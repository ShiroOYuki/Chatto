appId: dev.ciel.chatto
productName: Chatto
copyright: Copyright © 2026 Ciel — GPL-3.0-or-later
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  # Viewer pages served to the overlay window and OBS.
  - from: ../viewer/dist
    to: viewer
  - from: resources
    to: resources
  # The OBS plugin (built by `npm run build:obs-plugin`), installed into OBS from the Outputs page or the installer.
  - from: ../../obs-plugin/release/obs-chatto
    to: obs-plugin/obs-chatto
    filter:
      - '**/*'
      - '!**/*.pdb'
# Where the app looks for updates (electron-updater); also writes latest.yml next to the installer.
# Nothing is uploaded from here: the dist script passes --publish never and the release workflow uploads.
publish:
  provider: github
  owner: ShiroOYuki
  repo: Chatto
win:
  target:
    - nsis
  icon: resources/icon.png
# Double-clicking a theme package opens it in Chatto, which asks before importing it (#40).
# The installer registers the type and the uninstaller removes it. The icon (build/, made from
# resources/icon.png at 16–256 px) can later be replaced with one drawn for theme files.
fileAssociations:
  - ext: chattotheme
    name: Chatto.Theme
    description: Chatto theme
    icon: chattotheme.ico
nsis:
  oneClick: false
  # The installer shows the GPL before installing (settings → About shows it again in the app).
  license: ../../LICENSE
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  # The app's languages; build/installer.nsh has strings for exactly these two.
  installerLanguages:
    - en_US
    - zh_TW
