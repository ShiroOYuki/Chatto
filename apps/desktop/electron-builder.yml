appId: dev.ciel.chatto
productName: Chatto
copyright: Copyright © 2026 Ciel — GPL-3.0-or-later
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  # Viewer pages served to the overlay window and OBS.
  - from: ../viewer/dist
    to: viewer
  - from: resources
    to: resources
  # The OBS plugin (built by `npm run build:obs-plugin`), installed into OBS from the Outputs page or the installer.
  - from: ../../obs-plugin/release/obs-chatto
    to: obs-plugin/obs-chatto
    filter:
      - '**/*'
      - '!**/*.pdb'
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
