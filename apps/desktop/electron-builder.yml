appId: dev.ciel.chatto
productName: Chatto
copyright: Copyright © 2026 Ciel — GPL-3.0-or-later
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  # Viewer pages served to the overlay window and OBS.
  - from: ../viewer/dist
    to: viewer
  - from: resources
    to: resources
  # The OBS plugin (built by `npm run build:obs-plugin`), installed into OBS from the Outputs page or the installer.
  - from: ../../obs-plugin/release/obs-chatto
    to: obs-plugin/obs-chatto
    filter:
      - '**/*'
      - '!**/*.pdb'
# Where the app looks for updates (electron-updater); also writes latest.yml next to the installer.
# Nothing is uploaded from here: the dist script passes --publish never and the release workflow uploads.
publish:
  provider: github
  owner: ShiroOYuki
  repo: Chatto
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  # The app's languages; build/installer.nsh has strings for exactly these two.
  installerLanguages:
    - en_US
    - zh_TW
