name: Release

# Runs after CI passes on main (called from ci.yml). If the app version has no tag yet, it builds
# the installer, tags the commit v<version> and drafts a GitHub Release whose notes come from
# apps/site/src/changelog.mjs (with GitHub's list of changes after them, and the whole changelog
# attached as changelog.json for the app's update dialog); publishing stays manual
# and deploys the site (site.yml).
# It can also be run by hand on main to retry a failed release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build the installer and draft a release
    # windows-2025 ships Visual Studio 2026, which the OBS plugin's CI preset uses.
    runs-on: windows-2025
    env:
      # Public, not a secret: it ends up inside the installer anyway.
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Check the branch, the version and the Client ID
        id: version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only"
            exit 1
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists, nothing to release. Bump the version to make a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ -z "$TWITCH_CLIENT_ID" ]; then
            echo "::error::Set the TWITCH_CLIENT_ID repository variable (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
      - uses: actions/setup-node@v5
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm
      # The notes come from the site's changelog; a version without an entry stops the release
      # here, before anything is built or tagged.
      - name: Write the release notes
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node apps/site/src/releaseNotes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          mkdir -p "$RUNNER_TEMP/changelog"
          node apps/site/src/changelogJson.mjs > "$RUNNER_TEMP/changelog/changelog.json"
      - run: npm ci
        if: steps.version.outputs.skip == 'false'
      # OBS sources and obs-deps for the plugin, shared with the OBS plugin workflow.
      - uses: actions/cache@v5
        if: steps.version.outputs.skip == 'false'
        with:
          path: obs-plugin/.deps
          key: obs-deps-${{ runner.os }}-${{ hashFiles('obs-plugin/buildspec.json') }}
      - name: Build the installer
        if: steps.version.outputs.skip == 'false'
        run: npm run dist
        env:
          MAIN_VITE_TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      - name: Check that the Client ID is built in
        if: steps.version.outputs.skip == 'false'
        run: |
          if ! grep -q "$TWITCH_CLIENT_ID" apps/desktop/out/main/index.js; then
            echo "::error::The built app does not contain the Client ID"
            exit 1
          fi
      # Tagged only after the build succeeds, so a failed build can simply be run again.
      # A tag pushed with the workflow token does not start other workflows.
      - name: Tag the commit
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Draft the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # latest.yml and the blockmap are what installed copies read to find and download the update;
        # changelog.json is what their update dialog shows (#39).
        run: |
          version="${TAG#v}"
          dir="apps/desktop/release/$version"
          gh release create "$TAG" --verify-tag --draft --title "Chatto $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            "$dir/Chatto-Setup-$version.exe" "$dir/Chatto-Setup-$version.exe.blockmap" "$dir/latest.yml" \
            "$RUNNER_TEMP/changelog/changelog.json"
