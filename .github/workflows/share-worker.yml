name: Share service

# Deploys the theme sharing Worker (apps/share-worker, GitHub #4) when it or the code it bundles
# changes on main. Deployment stays off until the repository variable SHARE_DEPLOY is "true"
# (setup steps: docs/share-service.md); the tests run either way.
on:
  push:
    branches: [main]
    paths:
      - apps/share-worker/**
      - packages/share/**
      - packages/core/**
      - packages/chat-ui/src/**
      - .github/workflows/share-worker.yml
  workflow_dispatch:

concurrency:
  group: share-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @chatto/share -w @chatto/share-worker
      - run: npx vitest run packages/share apps/share-worker
      - name: Apply database migrations
        if: vars.SHARE_DEPLOY == 'true'
        working-directory: apps/share-worker
        run: npx wrangler d1 migrations apply chatto-share --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: vars.SHARE_DEPLOY == 'true'
        working-directory: apps/share-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
